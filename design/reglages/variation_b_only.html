<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APIGO — Paramètres (Variation B)</title>
  <link rel="stylesheet" href="source/shared/tokens.css" />
  <style>
    html, body { height: 100%; margin: 0; background: var(--surface-primary); }
    #root { width: 100vw; height: 100vh; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="source/shared/icons.jsx"></script>
  <script type="text/babel" src="source/shared/data.jsx"></script>
  <script type="text/babel" src="source/shared/sidebar.jsx"></script>
  <script type="text/babel" src="source/variation-b.jsx"></script>

  <script type="text/babel">
    const tryMount = () => {
      if (window.VariationB && window.Sidebar) {
        ReactDOM.createRoot(document.getElementById('root')).render(<window.VariationB />);
      } else {
        setTimeout(tryMount, 50);
      }
    };
    tryMount();
  </script>
</body>
</html>
