<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>APIGO — Refonte Paramètres</title>
  <link rel="stylesheet" href="shared/tokens.css" />
  <style>
    html, body { height: 100%; margin: 0; background: #ece9e3; }
    .stage-host { width: 100vw; height: 100vh; }
    .artboard-shell {
      width: 100%; height: 100%;
      background: var(--surface-primary);
      overflow: hidden;
    }
    .intro {
      padding: 28px 32px; max-width: 920px;
      font-family: var(--font-text);
      color: var(--text-primary);
    }
    .intro h1 { font-family: var(--font-display); font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin: 0 0 8px; }
    .intro p { font-size: 14px; line-height: 1.6; color: var(--text-secondary); margin: 0 0 10px; }
    .intro ul { font-size: 13.5px; line-height: 1.65; color: var(--text-secondary); padding-left: 18px; margin: 6px 0 14px; }
    .intro b { color: var(--text-primary); font-weight: 600; }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; background: var(--honey-soft); color: var(--honey-deep); font-size: 11.5px; font-weight: 600; margin-right: 6px; }
    code { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-muted); padding: 1px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="root" class="stage-host"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="shared/icons.jsx"></script>
  <script type="text/babel" src="shared/data.jsx"></script>
  <script type="text/babel" src="shared/sidebar.jsx"></script>
  <script type="text/babel" src="variations/variation-a.jsx"></script>
  <script type="text/babel" src="variations/variation-b.jsx"></script>
  <script type="text/babel" src="variations/variation-c.jsx"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Intro = () => (
      <div className="intro">
        <h1>Refonte UI / UX — Paramètres du profil</h1>
        <p>L'écran actuel est dense visuellement : <b>5 couleurs d'icônes</b> différentes, beaucoup de petites cards empilées en deux colonnes, hiérarchie plate, et bouton <i>Enregistrer</i> qui peut disparaître au scroll. Voici trois directions, toutes alignées sur le système <span className="pill">Warm Precision</span> existant (honey #f5a623, surfaces stone, SF Pro), mais avec des partis pris distincts.</p>

        <ul>
          <li><b>A — Quiet</b> · navigation latérale par onglets, palette quasi mono­chrome, <b>barre d'enregistrement sticky</b> en bas. Lecture facile, charge cognitive réduite. Le pari le plus sûr.</li>
          <li><b>B — Editorial</b> · <i>une seule page</i> longue avec sommaire latéral, grosse typo, sections numérotées, tableau de valeurs <code>label · value · action</code>. Calme, premium, parfait pour un compte qu'on ne touche pas tous les jours.</li>
          <li><b>C — Cockpit</b> · trois panneaux (rail compte + liste centrale + drawer contextuel). Chaque ligne s'édite à droite sans changer de page. Pour les power-users qui modifient souvent.</li>
        </ul>

        <p>Faites défiler vers le bas pour voir les trois maquettes côte à côte. Cliquez sur une maquette pour la passer en plein écran (touche <code>F</code>) ou réorganisez-les par drag.</p>
      </div>
    );

    const W = ({ children }) => <div className="artboard-shell">{children}</div>;

    const App = () => (
      <DesignCanvas title="Paramètres · Refonte" subtitle="3 directions sur la base du système Warm Precision">
        <DCSection id="intro" title="Brief">
          <DCArtboard id="brief" label="Lecture rapide" width={960} height={420}>
            <Intro />
          </DCArtboard>
        </DCSection>

        <DCSection id="variations" title="Trois directions">
          <DCArtboard id="varA" label="A — Quiet · tabs latéraux + sticky save" width={1280} height={880}>
            <W><window.VariationA /></W>
          </DCArtboard>
          <DCArtboard id="varB" label="B — Editorial · long-form, sommaire" width={1280} height={880}>
            <W><window.VariationB /></W>
          </DCArtboard>
          <DCArtboard id="varC" label="C — Cockpit · 3 panneaux + drawer" width={1280} height={880}>
            <W><window.VariationC /></W>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );

    /* Wait for components to attach to window before mounting */
    const tryMount = () => {
      if (window.VariationA && window.VariationB && window.VariationC && window.DesignCanvas && window.Sidebar) {
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
      } else {
        setTimeout(tryMount, 50);
      }
    };
    tryMount();
  </script>
</body>
</html>
