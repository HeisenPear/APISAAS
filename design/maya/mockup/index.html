<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya — Copilot APIGO</title>
<link rel="stylesheet" href="shared/tokens.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #f0eee9; font-family: var(--font-text); }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="shared/icons.jsx"></script>
  <script type="text/babel" src="shared/data.jsx"></script>
  <script type="text/babel" src="shared/maya-ui.jsx"></script>
  <script type="text/babel" src="shared/sidebar2.jsx"></script>
  <script type="text/babel" src="shared/topbar2.jsx"></script>
  <script type="text/babel" src="pages/maya-a.jsx"></script>
  <script type="text/babel" src="pages/maya-b.jsx"></script>
  <script type="text/babel" src="pages/maya-c.jsx"></script>
  <script type="text/babel" src="pages/contextual.jsx"></script>
  <script type="text/babel" src="pages/mobile.jsx"></script>
  <script type="text/babel" src="pages/pwa.jsx"></script>
  <script type="text/babel" src="pages/pwa2.jsx"></script>
  <script type="text/babel" src="pages/bubble.jsx"></script>
  <script type="text/babel" src="pages/identity.jsx"></script>
  <script type="text/babel" src="pages/system.jsx"></script>
  <script type="text/babel" src="pages/forms.jsx"></script>
  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
    const App = () => (
      <DesignCanvas title="Maya — Copilot APIGO" subtitle="Binôme apicole déterministe & chaleureux · système Warm Precision · identité honey calme, zéro dégradé orange-vert">
        <DCSection id="identite" title="Maya — identité, logo & mouvement" subtitle="Le rayon de miel : un hexagone d'alvéoles vivantes · ton honey calme · le mouvement raconte l'état de Maya">
          <DCArtboard id="id-logo" label="Logo & construction" width={1280} height={880}>
            <window.MayaLogo />
          </DCArtboard>
          <DCArtboard id="id-motion" label="Mouvement (états animés, en direct)" width={1280} height={880}>
            <window.MayaMotion />
          </DCArtboard>
          <DCArtboard id="id-brand" label="Palette & application" width={1280} height={880}>
            <window.MayaBrand />
          </DCArtboard>
          <DCPostIt top={-30} left={3870} rotate={2} width={250}>Le logo n'est plus un objet dans un hexagone : c'est UN rayon de miel (hexagone d'alvéoles) qui s'anime. Repos = respiration, réflexion = remplissage, alerte = pulsation, réussite = éclosion. Même esprit que le logo Claude, sur l'apiculture.</DCPostIt>
        </DCSection>

        <DCSection id="systeme" title="Système — boutons & graphiques" subtitle="Références pour le handoff : grammaire des boutons · bibliothèque data-viz (jauges, courbes, barres, thème ECharts)">
          <DCArtboard id="sys-buttons" label="Boutons & contrôles" width={1280} height={880}>
            <window.ButtonsBoard />
          </DCArtboard>
          <DCArtboard id="sys-graphics" label="Graphiques produit" width={1280} height={880}>
            <window.GraphicsBoard />
          </DCArtboard>
          <DCPostIt top={-30} left={2580} rotate={-2} width={240}>Planches ajoutées pour compléter le système : tout ce que le handoff décrit (boutons, jauges, courbes, barres, palette ECharts) a maintenant un visuel cible.</DCPostIt>
        </DCSection>

        <DCSection id="pwa" title="Maya — PWA mobile · le binôme" subtitle="Le cœur de l'expérience · 402 × 874 · déterministe (règles éprouvées, pas un chatbot), guidé au tap, profondément humain">
          <DCArtboard id="pwa-meet" label="Rencontrer Maya (onboarding)" width={402} height={874}>
            <window.MayaPwaMeet />
          </DCArtboard>
          <DCArtboard id="pwa-home" label="Accueil · le cœur" width={402} height={874}>
            <window.MayaPwaHome />
          </DCArtboard>
          <DCArtboard id="pwa-guided" label="Parcours guidé (déterministe, au tap)" width={402} height={874}>
            <window.MayaPwaGuided />
          </DCArtboard>
          <DCArtboard id="pwa-voiceres" label="Dictée → fiche structurée" width={402} height={874}>
            <window.MayaPwaVoiceResult />
          </DCArtboard>
          <DCArtboard id="pwa-recap" label="Bilan · moment humain" width={402} height={874}>
            <window.MayaPwaRecap />
          </DCArtboard>
          <DCPostIt top={-30} left={2070} rotate={2} width={240}>Maya n'est pas un LLM : modèle full déterministe. Les conseils suivent des règles apicoles éprouvées → reformulé en argument de confiance. Zéro champ de texte libre : on répond au tap, à la voix. Et surtout : un binôme qui veille, célèbre et prend soin — pas un robot de service.</DCPostIt>
        </DCSection>

        <DCSection id="formulaires" title="APIGO — formulaires unifiés" subtitle="Une seule grammaire de saisie pour tout le site · moderne, terrain, pré-remplie par Maya">
          <DCArtboard id="form-kit" label="Le kit (tous les champs)" width={1280} height={880}>
            <window.FormsKit />
          </DCArtboard>
          <DCArtboard id="form-desktop" label="Desktop · Nouvelle intervention" width={1280} height={880}>
            <window.FormDesktop />
          </DCArtboard>
          <DCArtboard id="form-mobile" label="Mobile · Compte-rendu de visite" width={402} height={874}>
            <window.FormMobile />
          </DCArtboard>
          <DCArtboard id="form-archetypes" label="Archétypes · connexion & assistant multi-étapes" width={1280} height={880}>
            <window.FormArchetypes />
          </DCArtboard>
          <DCPostIt top={-30} left={2840} rotate={-2} width={240}>Formulaires unifiés : cibles 46px, focus honey, choix au tap (segmented/chips) plutôt que saisie libre, et un état « pré-rempli par Maya ». Mêmes composants partout — web et terrain.</DCPostIt>
        </DCSection>

        <DCSection id="discret" title="Maya — mode discret (la bulle)" subtitle="Une autre façon de vivre : pas partout, juste une petite bulle qu'on appelle. Présence réglable + chatbot sobre.">
          <DCArtboard id="bubble-presence" label="Réglage de présence (Paramètres)" width={1280} height={880}>
            <window.MayaPresence />
          </DCArtboard>
          <DCArtboard id="bubble-web" label="La bulle ouverte · web" width={1280} height={880}>
            <window.MayaBubbleWeb />
          </DCArtboard>
          <DCArtboard id="bubble-states" label="La bulle fermée · états + menu" width={1280} height={880}>
            <window.MayaBubbleStates />
          </DCArtboard>
          <DCArtboard id="bubble-mobile" label="La bulle · mobile (feuille)" width={402} height={874}>
            <window.MayaBubbleMobile />
          </DCArtboard>
          <DCPostIt top={-30} left={4180} rotate={2} width={250}>Deux personnalités d'une même Maya : « partout » (proactive) ou « discrète » (la bulle, sur demande). Réglable dans Paramètres + menu ⋯ de la bulle. Même identité, même logo vivant — juste plus sobre.</DCPostIt>
        </DCSection>

        <DCSection id="dediee" title="Maya — page dédiée (desktop)" subtitle="3 variations à comparer · 1280 × 880 · conversation, sources, actions inline">
          <DCArtboard id="maya-a" label="A · Conversation enrichie" width={1280} height={880}>
            <window.MayaA />
          </DCArtboard>
          <DCArtboard id="maya-b" label="B · Atelier (split canvas)" width={1280} height={880}>
            <window.MayaB />
          </DCArtboard>
          <DCArtboard id="maya-c" label="C · Briefing proactif" width={1280} height={880}>
            <window.MayaC />
          </DCArtboard>
          <DCPostIt top={-30} left={1300} rotate={2} width={220}>3 directions : A conversationnelle · B analytique (atelier) · C proactive. Mixables — l'atelier de B peut vivre dans A, le briefing de C en page d'accueil Maya.</DCPostIt>
        </DCSection>

        <DCSection id="contextuelle" title="Maya — partout dans l'app" subtitle="« Tout ce qui tourne autour » : dashboard, ⌘K, panneau contextuel, launcher">
          <DCArtboard id="ctx-dash" label="Carte proactive sur le dashboard" width={1280} height={880}>
            <window.MayaCtxDash />
          </DCArtboard>
          <DCArtboard id="ctx-cmdk" label="Barre de commande ⌘K" width={1280} height={880}>
            <window.MayaCommandK />
          </DCArtboard>
          <DCArtboard id="ctx-panel" label="Panneau latéral contextuel" width={1280} height={880}>
            <window.MayaSidePanel />
          </DCArtboard>
          <DCArtboard id="ctx-launcher" label="Launcher flottant + menu rapide" width={1280} height={880}>
            <window.MayaLauncherFull />
          </DCArtboard>
        </DCSection>

        <DCSection id="mobile" title="Maya — terrain (mobile)" subtitle="L'apiculteur au rucher · 402 × 874 · capture vocale mains libres">
          <DCArtboard id="mob-voice" label="Capture vocale (moment IA)" width={402} height={874}>
            <window.MayaMobVoice />
          </DCArtboard>
          <DCArtboard id="mob-ctx" label="Maya sur une fiche ruche" width={402} height={874}>
            <window.MayaMobContext />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
