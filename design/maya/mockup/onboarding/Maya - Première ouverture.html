<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya — Première ouverture</title>
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #e9e5dd; font-family: var(--font-text); display: grid; place-items: center; }
  #root { width: 100%; }

  /* ── Animations d'onboarding ── */
  /* éveil : les alvéoles éclosent une à une (centre → couronne) */
  @keyframes onb-pop {
    0%   { opacity: 0; transform: scale(0.15) rotate(-14deg); }
    60%  { opacity: 1; transform: scale(1.16) rotate(3deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  .onb-wake .maya-cell { transform-box: fill-box; transform-origin: center; animation: onb-pop 0.6s cubic-bezier(.34,1.3,.5,1) both; }
  .onb-wake .maya-cell:nth-child(2) { animation-delay: 0.15s; }
  .onb-wake .maya-cell:nth-child(3) { animation-delay: 0.30s; }
  .onb-wake .maya-cell:nth-child(4) { animation-delay: 0.40s; }
  .onb-wake .maya-cell:nth-child(5) { animation-delay: 0.50s; }
  .onb-wake .maya-cell:nth-child(6) { animation-delay: 0.60s; }
  .onb-wake .maya-cell:nth-child(7) { animation-delay: 0.70s; }
  .onb-wake .maya-cell:nth-child(8) { animation-delay: 0.80s; }
  /* le rayon respire doucement une fois éveillé */
  @keyframes onb-breathe { 0%,100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.04) rotate(0.6deg); } }
  .onb-wake-inner { animation: onb-breathe 5.5s ease-in-out 1.1s infinite; transform-origin: center; }
  /* halo qui grandit puis palpite */
  @keyframes onb-halo { 0% { opacity: 0; transform: scale(0.5); } 45% { opacity: 0.9; } 100% { opacity: 0.7; transform: scale(1); } }
  @keyframes onb-halo-pulse { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.07); } }
  .onb-halo { animation: onb-halo 1s ease-out both, onb-halo-pulse 3.6s ease-in-out 1s infinite; }
  /* anneau qui s'écarte */
  @keyframes onb-ring { 0% { opacity: 0; transform: scale(0.6); } 30% { opacity: 0.8; } 100% { opacity: 0; transform: scale(1.5); } }
  .onb-ring { animation: onb-ring 2.4s ease-out 0.6s infinite; }
  /* contenu : montée + fondu (relancé à chaque étape via key) */
  @keyframes onb-rise { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: none; } }
  .onb-rise { animation: onb-rise 0.5s cubic-bezier(.2,.7,.3,1) both; }
  /* apparition de la modale web (sort du centre) */
  @keyframes onb-modal { 0% { opacity: 0; transform: scale(0.94) translateY(10px); } 100% { opacity: 1; transform: none; } }
  @keyframes onb-scrim { 0% { opacity: 0; } 100% { opacity: 1; } }

  .onb-toggle { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; gap: 4px; background: #fff; border: 1px solid var(--border-default); border-radius: 12px; padding: 4px; box-shadow: var(--shadow-md); }
  .onb-toggle button { border: none; background: transparent; font: inherit; font-size: 13px; font-weight: 600; color: var(--text-tertiary); padding: 7px 16px; border-radius: 9px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
  .onb-toggle button.on { background: #1c1c1e; color: #fff; }

  a, a:hover { color: var(--honey-deep); }
  @media (prefers-reduced-motion: reduce) {
    .onb-wake .maya-cell, .onb-wake-inner, .onb-halo, .onb-ring, .onb-rise { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="../ios-frame.jsx"></script>
  <script type="text/babel" src="../shared/icons.jsx"></script>
  <script type="text/babel" src="../shared/maya-ui.jsx"></script>
  <script type="text/babel" src="onboarding.jsx"></script>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { useOnboarding, StepBody, Dots, WakeMark, STEPS } = window.MayaOnb;

    const isBookend = (key) => key === 'wake' || key === 'ready';

    /* Bouton principal + secondaire */
    const CTA = ({ label, onClick, dark }) => (
      <button onClick={onClick} style={{ width: '100%', height: 52, border: 'none', borderRadius: 15, background: dark ? '#f5a623' : '#1c1c1e', color: '#fff', fontSize: 16, fontWeight: 600, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 9, cursor: 'pointer', boxShadow: dark ? '0 10px 26px rgba(245,166,35,0.36)' : '0 8px 22px rgba(28,28,30,0.24)' }}>
        {label} {React.createElement(window.I.arrowUpRight, { size: 19, stroke: 2.3 })}
      </button>
    );

    /* ══ ENVELOPPE MOBILE — plein écran immersif (sombre) ══ */
    const MobileOnb = () => {
      const o = useOnboarding();
      const bookend = isBookend(o.key);
      return (
        <window.IOSDevice width={402} height={874} dark>
          <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: 'radial-gradient(130% 72% at 50% 6%, #2c2b2e, #161617 60%)', color: '#fff' }}>
            {/* header discret sur les étapes du milieu */}
            {!bookend && (
              <div style={{ paddingTop: 58, padding: '58px 22px 0', display: 'flex', alignItems: 'center', gap: 11 }}>
                <window.MayaMark size={30} glow state="idle" />
                <span style={{ fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 15 }}>Maya</span>
                <button onClick={() => o.setStep(o.total - 1)} style={{ marginLeft: 'auto', background: 'none', border: 'none', color: 'rgba(255,255,255,0.5)', fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>Passer</button>
              </div>
            )}

            <div key={o.key} style={{ flex: 1, overflow: 'auto', padding: bookend ? '40px 26px 12px' : '20px 22px 12px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: bookend ? 28 : 0 }}>
              {bookend && <WakeMark size={104} big playKey={o.key} />}
              <StepBody step={o.key} scale="m" dark presence={o.presence} setPresence={o.setPresence} />
            </div>

            <div style={{ flexShrink: 0, padding: '14px 24px 36px' }}>
              <div style={{ marginBottom: 18 }}><Dots step={o.step} total={o.total} dark /></div>
              {o.step === o.total - 1
                ? <CTA dark label={o.presence === 'partout' ? 'Voir mon point du jour' : "C'est parti"} onClick={o.restart} />
                : <CTA dark label={o.key === 'wake' ? 'Faire connaissance' : 'Continuer'} onClick={o.next} />}
              {o.step > 0 && o.step < o.total - 1 && (
                <button onClick={o.back} style={{ width: '100%', marginTop: 10, background: 'none', border: 'none', color: 'rgba(255,255,255,0.45)', fontSize: 13, fontWeight: 500, cursor: 'pointer' }}>Retour</button>
              )}
            </div>
          </div>
        </window.IOSDevice>
      );
    };

    /* Fond d'app simplifié (flouté) derrière la modale web */
    const AppSkeleton = () => (
      <div style={{ position: 'absolute', inset: 0, display: 'flex', filter: 'blur(3px)', opacity: 0.5 }}>
        <div style={{ width: 232, background: '#1c1c1e' }} />
        <div style={{ flex: 1, background: 'var(--surface-primary)' }}>
          <div style={{ height: 60, borderBottom: '1px solid var(--border-default)' }} />
          <div style={{ padding: 28 }}>
            <div style={{ height: 30, width: 260, background: 'var(--surface-sunk)', borderRadius: 8 }} />
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 14, marginTop: 24 }}>
              {[0,1,2,3].map(i => <div key={i} style={{ height: 96, background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 14 }} />)}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', gap: 20, marginTop: 20 }}>
              <div style={{ height: 220, background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 14 }} />
              <div style={{ height: 220, background: 'var(--surface-card)', border: '1px solid var(--border-default)', borderRadius: 14 }} />
            </div>
          </div>
        </div>
      </div>
    );

    /* ══ ENVELOPPE WEB — modale d'accueil par-dessus l'app ══ */
    const WebOnb = () => {
      const o = useOnboarding();
      const bookend = isBookend(o.key);
      return (
        <div style={{ position: 'relative', width: 1280, height: 880, background: 'var(--surface-primary)', overflow: 'hidden', fontFamily: 'var(--font-text)' }}>
          <AppSkeleton />
          <div style={{ position: 'absolute', inset: 0, background: 'rgba(28,22,16,0.42)', animation: 'onb-scrim .4s ease both' }} />
          <div style={{ position: 'absolute', inset: 0, display: 'grid', placeItems: 'center', padding: 40 }}>
            <div style={{ width: 640, maxHeight: '100%', background: 'linear-gradient(180deg,#fdf8ef,#fbf3e4)', borderRadius: 26, boxShadow: '0 40px 100px rgba(40,30,20,0.4)', border: '1px solid rgba(180,140,80,0.2)', overflow: 'hidden', display: 'flex', flexDirection: 'column', animation: 'onb-modal .5s cubic-bezier(.2,.8,.3,1.02) both' }}>
              {/* hero sombre : le rayon vit ici */}
              <div style={{ position: 'relative', overflow: 'hidden', background: 'linear-gradient(135deg,#2c2218,#1a1a1c)', padding: bookend ? '40px 0 34px' : '22px 26px', display: 'flex', alignItems: 'center', justifyContent: bookend ? 'center' : 'flex-start', gap: 13 }}>
                <div style={{ position: 'absolute', width: 260, height: 260, borderRadius: '50%', left: '50%', top: -150, transform: 'translateX(-50%)', background: 'radial-gradient(circle, rgba(245,166,35,0.4), transparent 70%)', filter: 'blur(8px)' }} />
                {bookend ? (
                  <div style={{ position: 'relative' }}><WakeMark size={96} big playKey={o.key} /></div>
                ) : (
                  <div style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 12, width: '100%' }}>
                    <window.MayaMark size={38} glow state="idle" />
                    <div style={{ flex: 1 }}>
                      <div style={{ fontFamily: 'var(--font-display)', fontWeight: 600, fontSize: 16, color: '#fff' }}>Maya</div>
                      <div style={{ fontSize: 11.5, color: 'rgba(255,255,255,0.6)' }}>Fais connaissance avec ton assistant</div>
                    </div>
                    <button onClick={() => o.setStep(o.total - 1)} style={{ background: 'rgba(255,255,255,0.1)', border: 'none', color: '#fff', fontSize: 12.5, fontWeight: 600, padding: '7px 14px', borderRadius: 9, cursor: 'pointer' }}>Passer</button>
                  </div>
                )}
              </div>

              {/* corps clair */}
              <div key={o.key} style={{ padding: '34px 44px 10px', overflow: 'auto' }}>
                <StepBody step={o.key} scale="w" presence={o.presence} setPresence={o.setPresence} />
              </div>

              {/* pied */}
              <div style={{ display: 'flex', alignItems: 'center', gap: 16, padding: '18px 32px 26px', marginTop: 'auto' }}>
                <div style={{ width: 96 }}>{o.step > 0 && o.step < o.total - 1 && (
                  <button onClick={o.back} style={{ background: 'none', border: 'none', color: 'var(--text-tertiary)', fontSize: 13.5, fontWeight: 600, cursor: 'pointer' }}>← Retour</button>
                )}</div>
                <div style={{ flex: 1 }}><Dots step={o.step} total={o.total} /></div>
                <div style={{ width: 210, display: 'flex', justifyContent: 'flex-end' }}>
                  {o.step === o.total - 1
                    ? <div style={{ width: 210 }}><CTA label={o.presence === 'partout' ? 'Voir mon point du jour' : "C'est parti"} onClick={o.restart} /></div>
                    : <div style={{ width: 210 }}><CTA label={o.key === 'wake' ? 'Faire connaissance' : 'Continuer'} onClick={o.next} /></div>}
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    const Fit = ({ w, h, children }) => {
      const [s, setS] = useState(1);
      useEffect(() => {
        const calc = () => {
          const vw = window.innerWidth - 40;
          const vh = window.innerHeight - 104;
          setS(Math.min(vw / w, vh / h, 1));
        };
        calc();
        window.addEventListener('resize', calc);
        return () => window.removeEventListener('resize', calc);
      }, [w, h]);
      return (
        <div style={{ width: w * s, height: h * s }}>
          <div style={{ width: w, height: h, transform: `scale(${s})`, transformOrigin: 'top left' }}>{children}</div>
        </div>
      );
    };

    const App = () => {
      const [dev, setDev] = useState(() => localStorage.getItem('maya_onb_dev') || 'mobile');
      const pick = (d) => { setDev(d); localStorage.setItem('maya_onb_dev', d); };
      return (
        <div style={{ minHeight: '100vh', display: 'grid', placeItems: 'center', padding: '84px 20px 24px' }}>
          <div className="onb-toggle">
            <button className={dev === 'mobile' ? 'on' : ''} onClick={() => pick('mobile')}>{React.createElement(window.I.phone, { size: 15 })} Mobile</button>
            <button className={dev === 'web' ? 'on' : ''} onClick={() => pick('web')}>{React.createElement(window.I.layoutGrid, { size: 15 })} Web</button>
          </div>
          {dev === 'mobile'
            ? <Fit w={402} h={874}><MobileOnb /></Fit>
            : <Fit w={1280} h={880}><WebOnb /></Fit>}
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
